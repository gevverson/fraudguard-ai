name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fraudguard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraudguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q src tests migrations scripts

      - name: Lint
        run: python -m ruff check src tests migrations scripts

      - name: Apply and verify database migration
        env:
          FRAUDGUARD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fraudguard
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Test pilot core and integrations with coverage
        env:
          FRAUDGUARD_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fraudguard
          FRAUDGUARD_TEST_POSTGRES_APP_URL: postgresql+psycopg://fraudguard_test_app:fraudguard-test-app-password@localhost:5432/fraudguard
          FRAUDGUARD_TEST_REDIS_URL: redis://localhost:6379/15
        run: >-
          python -m pytest
          --cov=src.config
          --cov=src.security
          --cov=src.persistence
          --cov=src.policy
          --cov=src.velocity
          --cov=src.rate_limit
          --cov=src.ingress
          --cov=src.service
          --cov=src.runtime
          --cov=src.app.api
          --cov=src.decision
          --cov=src.models.evaluation
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
